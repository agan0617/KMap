<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3ead7">
<meta name="description" content="K地圖：邊玩邊熟悉地圖。點亮每一個都道府縣，集滿御朱印。">
<title>K地圖</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 首頁 -->
  <section id="home" class="screen">
    <header class="home-head">
      <div class="logo"><span id="logoDog"></span><h1>K地圖</h1></div>
      <button class="icon-btn" id="hSettings" type="button" aria-label="設定">⚙</button>
    </header>
    <nav class="regions" id="regionTabs"></nav>
    <div class="home-map" id="homeMap"></div>
    <div class="progress" id="homeProgress"></div>
    <div class="modes">
      <button class="mode daily" id="mDaily" type="button"><b>今日挑戰</b><small id="dailyInfo"></small></button>
      <button class="mode" data-mode="loc" type="button"><b>找位置</b><small>點出指定的地方</small></button>
      <button class="mode" data-mode="know" type="button"><b>知識找地點</b><small>看名產、名勝猜地方</small></button>
      <button class="mode" data-mode="travel" type="button"><b>鄰接旅行</b><small>陪 Komugi 走到目的地</small></button>
      <button class="mode" data-mode="timed" type="button"><b>限時連擊</b><small id="timedBest">60 秒能答對幾題</small></button>
      <button class="mode" data-mode="explore" type="button"><b>圖鑑</b><small>點地圖看知識卡</small></button>
      <button class="mode" id="mBook" type="button"><b>御朱印帳</b><small id="bookInfo"></small></button>
    </div>
  </section>

  <!-- 遊玩畫面 -->
  <section id="play" class="screen" hidden>
    <header class="hud">
      <button class="icon-btn" id="pBack" type="button" aria-label="返回">‹</button>
      <div class="hud-title" id="pTitle"></div>
      <div class="hud-stat" id="pStat"></div>
    </header>
    <div class="map-wrap" id="playMap">
      <div class="zoom">
        <button type="button" data-z="in" aria-label="放大">＋</button>
        <button type="button" data-z="out" aria-label="縮小">－</button>
        <button type="button" data-z="reset" aria-label="全圖">⤢</button>
      </div>
      <div class="timer" id="pTimer" hidden><i></i></div>
    </div>
    <div class="panel" id="pPanel">
      <div class="prompt" id="pPrompt"></div>
      <div class="feedback" id="pFeedback"></div>
      <div class="actions" id="pActions"></div>
    </div>
  </section>

  <!-- 御朱印帳 -->
  <section id="book" class="screen" hidden>
    <header class="hud">
      <button class="icon-btn" id="bBack" type="button" aria-label="返回">‹</button>
      <div class="hud-title">御朱印帳</div>
      <div class="hud-stat" id="bStat"></div>
    </header>
    <div class="book-body" id="bookBody"></div>
  </section>

  <!-- 知識卡、結算、設定共用的彈窗 -->
  <div id="modal" hidden>
    <div class="sheet">
      <button class="icon-btn close" id="modalClose" type="button" aria-label="關閉">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toast" hidden></div>
</div>

<script src="data/japan-map.js"></script>
<script src="data/japan-info.js"></script>
<script src="js/regions.js"></script>
<script src="js/store.js"></script>
<script src="js/audio.js"></script>
<script src="js/komugi.js"></script>
<script src="js/map.js"></script>
<script src="js/quiz.js"></script>
<script src="js/main.js"></script>
</body>
</html>
