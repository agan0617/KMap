<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3ead7">
<meta name="description" content="K地圖：邊玩邊熟悉地圖。臺灣縣市、日本都道府縣、中國各省、世界各國，中英日三語。">
<title>K地圖</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 首頁 -->
  <section id="home" class="screen">
    <header class="home-head">
      <div class="logo"><button type="button" class="logo-dog" id="logoDog" data-ta="closet.title"></button><h1 data-t="appName">K地圖</h1><span class="ver" id="appVer"></span></div>
      <div class="head-right">
        <div class="lang-switch" id="langSwitch"></div>
        <button class="icon-btn" id="hShare" type="button" data-ta="share.app"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
        <button class="icon-btn" id="hSettings" type="button" data-ta="settings">⚙</button>
      </div>
    </header>
    <section class="hero">
      <button type="button" class="hero-dog" id="heroDog" data-ta="closet.title"></button>
      <div class="hero-side">
        <div class="hero-title" id="heroTitle"></div>
        <div class="bubble" id="heroBubble"></div>
        <div class="hero-row">
          <span class="coins" id="heroCoins"></span>
          <button type="button" class="btn small" id="hCloset" data-t="closet.btn"></button>
          <button type="button" class="btn small" id="hGacha"><span data-t="gacha.btn"></span><i class="badge" id="gachaBadge" hidden></i></button>
        </div>
        <div class="hero-done">
          <button type="button" class="btn small" id="mBook"><b></b><small id="bookInfo"></small></button>
          <span class="mast-chip" id="heroMastery"></span>
        </div>
      </div>
    </section>
    <button class="mode level" id="mLevel" type="button"><span class="lv-main"><b id="levelGo"></b><small id="levelInfo"></small></span><span class="lv-day" id="levelDay"></span></button>
    <button class="mode chal" id="mChal" type="button"><span class="lv-main"><b id="chalTitle"></b><small id="chalInfo"></small></span><span class="lv-day" id="chalBest"></span></button>
    <nav class="regions" id="regionTabs"></nav>
    <div class="home-map" id="homeMap">
      <button type="button" class="btn small map-corner" data-mode="explore" data-t="mode.explore"></button>
    </div>
    <div class="progress" id="homeProgress"></div>
  </section>

  <!-- 遊玩畫面 -->
  <section id="play" class="screen" hidden>
    <header class="hud">
      <button class="icon-btn" id="pBack" type="button" data-ta="back">‹</button>
      <div class="hud-title" id="pTitle"></div>
      <div class="hud-stat" id="pStat"></div>
    </header>
    <div class="map-wrap" id="playMap">
      <div class="zoom">
        <button type="button" data-z="in" data-ta="zoomIn">＋</button>
        <button type="button" data-z="out" data-ta="zoomOut">－</button>
        <button type="button" data-z="reset" data-ta="zoomReset"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="map-actions" id="pMapActs"></div>
    </div>
    <div class="panel" id="pPanel">
      <div class="prompt" id="pPrompt"></div>
      <div class="feedback" id="pFeedback"></div>
      <div class="ex" id="pEx" hidden></div>
      <div class="actions" id="pActions"></div>
    </div>
  </section>

  <!-- 御朱印帳 -->
  <section id="book" class="screen" hidden>
    <header class="hud">
      <button class="icon-btn" id="bBack" type="button" data-ta="back">‹</button>
      <div class="hud-title" data-t="mode.book"></div>
      <div class="hud-stat" id="bStat"></div>
    </header>
    <div class="book-body" id="bookBody"></div>
  </section>

  <!-- 知識卡、結算、設定共用的彈窗 -->
  <div id="modal" hidden>
    <div class="sheet">
      <button class="icon-btn close" id="modalClose" type="button" data-ta="close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toast" hidden></div>
</div>

<script src="data/japan-map.js"></script>
<script src="data/japan-info.js"></script>
<script src="data/japan-info.en.js"></script>
<script src="data/japan-info.ja.js"></script>
<script src="data/taiwan-map.js"></script>
<script src="data/taiwan-info.js"></script>
<script src="data/taiwan-units-1.js"></script>
<script src="data/taiwan-units-2.js"></script>
<script src="data/china-map.js"></script>
<script src="data/china-info.js"></script>
<script src="data/china-units-1.js"></script>
<script src="data/china-units-2.js"></script>
<script src="data/usa-map.js"></script>
<script src="data/usa-info.js"></script>
<script src="data/usa-units-1.js"></script>
<script src="data/usa-units-2.js"></script>
<script src="data/world-map.js"></script>
<script src="data/world-info.js"></script>
<script src="data/world-units-asia1.js"></script>
<script src="data/world-units-asia2.js"></script>
<script src="data/world-units-europe.js"></script>
<script src="data/world-units-africa.js"></script>
<script src="data/world-units-americas.js"></script>
<script src="data/world-units-oceania.js"></script>
<script src="data/world-continents.js"></script>
<script src="data/stats.js"></script>
<script src="data/extra-taiwan.js"></script>
<script src="data/extra-japan.js"></script>
<script src="data/extra-china.js"></script>
<script src="data/extra-usa.js"></script>
<script src="data/extra-world.js"></script>
<script src="js/version.js"></script>
<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-rewards.js"></script>
<script src="js/sync.js"></script>
<script src="js/regions.js"></script>
<script src="js/audio.js"></script>
<script src="js/komugi.js"></script>
<script src="js/rewards.js"></script>
<script src="js/map.js"></script>
<script src="js/quiz.js"></script>
<script src="js/main.js"></script>
</body>
</html>
