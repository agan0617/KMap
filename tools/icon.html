<!doctype html>
<!-- App 圖示的原稿：tools/build-icons.ps1 用 Edge headless 依不同尺寸截圖。
     ?mask=1 → 滿版底色、圖案縮進安全區（maskable／Android 前景）；?fg=1 → 透明底只畫圖案 -->
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}svg{display:block;width:100vw;height:100vh}</style>
<body>
<script src="../js/komugi.js"></script>
<script>
const q = new URLSearchParams(location.search), mask = q.has('mask'), fg = q.has('fg');
const k = mask || fg ? 0.72 : 1;  // 安全區：圖案縮到 72%
const bg = fg ? '' : mask ? '<rect width="100" height="100" fill="#f3ead7"/>' : '<rect x="2" y="2" width="96" height="96" rx="22" fill="#f3ead7"/>';
document.body.innerHTML = `<svg viewBox="0 0 100 100">${bg}
<g transform="translate(50 50) scale(${k}) translate(-50 -50)">
  <circle cx="50" cy="50" r="42" fill="#fbf6ea" stroke="#c8402c" stroke-width="4"/>
  <circle cx="50" cy="50" r="36.5" fill="none" stroke="#c8402c" stroke-width="1.6"/>
  <g transform="translate(50 52) scale(.62) translate(-50 -50)">${KOMUGI_SVG}</g>
</g></svg>`;
</script>
</body>
